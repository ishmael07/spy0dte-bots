const startDay = () => (D.paper ? D.phaseDays[state.period][0] : tf() === 1 ? D.days1[0] : D.days[D.days.length - state.period]);
const trades = () => run().trades.filter((t) => !t.skipped);

const setRange = () => { $("range").textContent = D.paper ? `${D.periodLabels[state.period]} · ${D.phaseDays[state.period].length ? dayShort(D.phaseDays[state.period][0]) + " – " + dayShort(D.phaseDays[state.period].at(-1)) : "starts at the next open"} · paper money · no real orders` : `${dayShort(startDay())} – ${dayShort(D.days.at(-1))} · ${state.period} sessions · buys calls/puts only · ${state.rule === "sniper_ppp" ? "up to 2 trades/day" : state.rule === "sniper4" ? "1 trade/day · adds to winners" : state.rule === "sniped1" ? "1m scalps · up to 3/day · adds to winners" : state.rule === "combined" ? "Sniper4 runners + Sniped1 scalps · one account" : "1 trade/day max"}`; };

function seg(el, items, cur, onPick) {
  el.innerHTML = "";
  for (const [k, label] of items) {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("aria-pressed", k === cur); b.textContent = label;
    b.onclick = () => onPick(k); el.append(b);
  }
}
function renderControls() {
  seg($("segStrat"), Object.entries(D.names), state.rule, (k) => { state.rule = k; state.k = 0; fixPeriod(); update(); });
  seg($("segPeriod"), D.periodsBy[state.rule].map((p) => [p, D.periodLabels ? D.periodLabels[p] : tf() === 1 ? `${p} days · 1m data` : `${p} days`]), state.period, (k) => { state.period = k; state.k = 0; update(); });
  seg($("segCap"), D.capitals.map((c) => [c, "$" + c]), state.cap, (k) => { state.cap = k; update(); });
  seg($("segSize"), D.sizing.map((z) => [z, SZ[z]]), state.size, (k) => { state.size = k; update(); });
}

function renderKpis() {
  const s = run().stats;
  const tiles = [
    ["Balance", money(s.final), `from ${money(s.start, 0)}`, "hero", cls(s.final - s.start)],
    ["Return", sgn(s.ret, 0) + "%", state.rule === "combined" ? `Sniper4 ${({ all: "100", half: "50", quarter: "25" })[state.size]}% · Sniped1 ${({ all: "50", half: "25", quarter: "10" })[state.size]}%` : `${D.names[state.rule]} · ${SZ[state.size]}`, "", cls(s.ret)],
    ["Win rate", s.winRate.toFixed(0) + "%", `${s.wins}W · ${s.trades - s.wins}L${s.skipped ? ` · ${s.skipped} unaffordable` : ""}`, "", ""],
    ["Avg win / loss", `${sgn(s.avgWin, 0)}% / ${sgn(s.avgLoss, 0)}%`, `best ${sgn(s.best, 0)}% · worst ${sgn(s.worst, 0)}%`, "", ""],
    ["Max drawdown", "−" + s.mdd.toFixed(0) + "%", "peak to trough", "", "neg"],
    D.paper ? ["Fill prices", `${s.realDays} real · ${s.modelDays} modeled`, "days priced from real option bars", "", ""] :
    ["Any 5-day week", `2× ${s.week.x2.toFixed(0)}% · 10× ${s.week.x10.toFixed(1)}%`, `odds at this bet size · up ${s.week.up.toFixed(0)}% of weeks`, "", ""],
    ["Trades per week", s.perWeek.toFixed(1), `${s.trades} in ${D.paper ? s.sessions : state.period} sessions`, "", ""],
    D.paper ? ["Days with a trade", `${s.tradeDays} of ${s.sessions}`, "sits out when there's no setup", "", ""] :
    ["Typical · bad case", s.odds ? `${money(s.odds[1], 0)} · ${money(s.odds[0], 0)}` : "—", "median · 10th pct of resampled runs", "", ""],
  ];
  $("kpis").innerHTML = tiles.map(([k, v, sub, h, c]) => `<div class="kpi ${h}"><span class="k">${k}</span><span class="v ${c}">${v}</span><span class="s">${sub}</span></div>`).join("");
}

function baseOpts(extra) {
  return Object.assign({
    autoSize: true,
    layout: { background: { type: "solid", color: css("--panel") }, textColor: css("--muted"), fontFamily: css("--f-num"), fontSize: 11, attributionLogo: false },
    grid: { vertLines: { color: css("--grid") }, horzLines: { color: css("--grid") } },
    rightPriceScale: { borderColor: css("--line") },
    timeScale: { borderColor: css("--line") },
    crosshair: { mode: 0, vertLine: { color: css("--faint"), labelBackgroundColor: css("--fg") }, horzLine: { color: css("--faint"), labelBackgroundColor: css("--fg") } },
  }, extra);
}

let band, eqChart, eqLine, eqMarks, px, cand, stUp, stDn, vwap, tradeLine, pxMarks, priceLines = [], opt, optLine, optLines = [];

function buildCharts() {
  $("eq").innerHTML = ""; $("px").innerHTML = ""; $("opt").innerHTML = "";
  eqChart = LC.createChart($("eq"), baseOpts({ handleScroll: false, handleScale: false, timeScale: { borderColor: css("--line"), fixLeftEdge: true, fixRightEdge: true } }));
  eqLine = eqChart.addSeries(LC.BaselineSeries, { baseValue: { type: "price", price: 100 }, lineWidth: 2,
    topLineColor: css("--up"), topFillColor1: "transparent", topFillColor2: "transparent", bottomLineColor: css("--down"), bottomFillColor1: "transparent", bottomFillColor2: "transparent",
    priceLineVisible: false, lastValueVisible: true, priceFormat: { type: "custom", formatter: (v) => money(v, 0) } });
  eqMarks = LC.createSeriesMarkers(eqLine, []);
  eqChart.subscribeClick((p) => { if (!p || !p.time) return; const k = trades().findIndex((t) => t.day === p.time); if (k >= 0) { state.k = k; renderTrade(); renderTable(); } });

  px = LC.createChart($("px"), baseOpts({ timeScale: { borderColor: css("--line"), timeVisible: true, secondsVisible: false } }));
  cand = px.addSeries(LC.CandlestickSeries, { upColor: css("--up"), downColor: css("--down"), borderVisible: false, wickUpColor: css("--up"), wickDownColor: css("--down"), priceLineVisible: false, lastValueVisible: false });
  const line = (color, extra) => px.addSeries(LC.LineSeries, Object.assign({ color, lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }, extra));
  stUp = line(css("--up")); stDn = line(css("--down")); vwap = line(css("--vwap"), { lineStyle: 1 });
  tradeLine = line(css("--fg"), { lineWidth: 2, lineStyle: 2 });
  pxMarks = LC.createSeriesMarkers(cand, []);
  px.subscribeCrosshairMove(renderHud);
  px.timeScale().subscribeVisibleLogicalRangeChange(placeBand);
  px.timeScale().subscribeSizeChange(placeBand);

  opt = LC.createChart($("opt"), baseOpts({ timeScale: { borderColor: css("--line"), timeVisible: true, secondsVisible: false } }));
  optLine = opt.addSeries(LC.AreaSeries, { lineColor: css("--fg"), topColor: "transparent", bottomColor: "transparent", lineWidth: 2, priceLineVisible: false, lastValueVisible: false,
    priceFormat: { type: "price", precision: 2, minMove: 0.01 } });
}

function renderEquity() {
  const ts = trades();
  const s = run().stats;
  eqLine.applyOptions({ baseValue: { type: "price", price: s.start } });
  const byDay = new Map();   // one point per day (Sniper+++ can trade twice a day)
  ts.forEach((t, k) => { const p = byDay.get(t.day) || { pnl: 0, sel: false }; byDay.set(t.day, { eq: t.eq, pnl: p.pnl + t.pnl, sel: p.sel || k === state.k }); });
  const pts = [{ time: prevDay(ts[0]?.day || D.days[0]), value: s.start }, ...[...byDay].map(([d, v]) => ({ time: d, value: v.eq }))];
  eqLine.setData(pts);
  eqMarks.setMarkers([...byDay].map(([d, v]) => ({ time: d, position: "inBar", shape: "circle", color: v.sel ? css("--fg") : (v.pnl > 0 ? css("--up") : css("--down")), size: v.sel ? 1.4 : 0.6 })));
  eqChart.timeScale().fitContent();
  $("eqLegend").innerHTML = `<span>${money(s.start, 0)} → <b>${money(s.final)}</b></span><span class="${cls(s.ret)}">${sgn(s.ret, 0)}%</span>`;
}
function prevDay(d) { const t = new Date(d + "T12:00:00Z"); do { t.setUTCDate(t.getUTCDate() - 1); } while ([0, 6].includes(t.getUTCDay())); return t.toISOString().slice(0, 10); }

function renderTrade() {
  const ts = trades();
  if (!ts.length) { $("card").innerHTML = '<div class="mut">No trades in this window.</div>'; return; }
  state.k = Math.min(state.k, ts.length - 1);
  const t = ts[state.k];
  const r = chartOf(t.day, t);
  const ser = (a) => r.t.map((x, i) => (a[i] == null ? { time: x } : { time: x, value: a[i] }));
  cand.setData(r.t.map((x, i) => ({ time: x, open: r.o[i], high: r.h[i], low: r.l[i], close: r.c[i] })));
  stUp.setData(ser(r.stUp)); stDn.setData(ser(r.stDn)); vwap.setData(ser(r.vwap));
  const call = t.side === "C";
  const win = t.pnl > 0;
  const step = ttf(t) * 60;
  const bar = (x) => r.t[0] + Math.floor((x - r.t[0]) / step) * step;
  tradeLine.applyOptions({ color: win ? css("--up") : css("--down") });
  const tA = bar(t.tIn), tB = Math.max(bar(t.tOut - step), tA);
  tradeLine.setData(tB > tA ? [{ time: tA, value: t.spyIn }, { time: tB, value: t.spyOut }] : []);
  pxMarks.setMarkers([
    { time: bar(t.tIn), position: call ? "belowBar" : "aboveBar", shape: call ? "arrowUp" : "arrowDown", color: call ? css("--up") : css("--down"), text: `BUY ${hhmm(t.tIn)}`, size: 1.6 },
    { time: bar(t.tOut - step), position: call ? "aboveBar" : "belowBar", shape: "circle", color: win ? css("--up") : css("--down"), text: `SELL ${hhmm(t.tOut)} ${sgn(t.pct, 0)}%`, size: 1.4 },
  ]);
  for (const p of priceLines) cand.removePriceLine(p);
  priceLines = [cand.createPriceLine({ price: t.stopLvl, color: css("--down"), lineWidth: 1, lineStyle: 1, axisLabelVisible: true, title: "stop" })];
  const tint = (win ? css("--up") : css("--down"));
  band = { from: bar(t.tIn), to: Math.max(bar(t.tOut - step), bar(t.tIn)), color: alpha(tint, 0.08) };
  const pad = ttf(t) === 1 ? 20 * 60 : 45 * 60;
  const from = Math.max(r.t[0], bar(t.tIn) - pad), to = Math.min(r.t.at(-1), bar(t.tOut - step) + pad);

  optLine.applyOptions({ lineColor: win ? css("--up") : css("--down") });
  const pathMap = new Map(t.path.map(([time, value]) => [bar(time), value]));
  optLine.setData(r.t.map((x) => (pathMap.has(x) ? { time: x, value: pathMap.get(x) } : { time: x })));
  for (const p of optLines) optLine.removePriceLine(p);
  optLines = [optLine.createPriceLine({ price: t.optIn, color: css("--muted"), lineStyle: 2, lineWidth: 1, axisLabelVisible: true, title: "buy" }),
              optLine.createPriceLine({ price: t.optOut, color: win ? css("--up") : css("--down"), lineStyle: 2, lineWidth: 1, axisLabelVisible: true, title: "sell" })];
  requestAnimationFrame(() => { px.timeScale().setVisibleRange({ from, to }); opt.timeScale().setVisibleRange({ from, to }); setTimeout(placeBand, 60); });

  $("tDay").textContent = dayLong(t.day);
  $("tIdx").textContent = `trade ${state.k + 1} of ${ts.length}`;
  $("prevT").disabled = state.k === 0; $("nextT").disabled = state.k === ts.length - 1;
  const held = Math.round((t.tOut - t.tIn) / 60);
  $("card").innerHTML = `
    <div class="contract"><span class="side ${t.side}">${call ? "CALL" : "PUT"}</span>SPY ${t.strike}${t.side} · 0DTE · ×${t.qty}</div>
    <div><div class="big ${cls(t.pnl)}">${sgnUsd(t.pnl)}</div><div class="${cls(t.pnl)} num">${sgn(t.pct, 1)}% on ${money(t.cost)}</div></div>
    <div class="leg"><span class="lbl">Buy</span><span class="tm">${hhmm(t.tIn)}</span><span class="px">$${t.optIn.toFixed(2)}</span><span class="sub">SPY ${t.spyIn.toFixed(2)}</span></div>
    <div class="leg"><span class="lbl">Sell</span><span class="tm">${hhmm(t.tOut)}</span><span class="px">$${t.optOut.toFixed(2)}</span><span class="sub">SPY ${t.spyOut.toFixed(2)} · ${WHY[t.reason] || t.reason}</span></div>
    <dl class="rows"><dt>Held</dt><dd>${held} min</dd><dt>Stop (SPY)</dt><dd>${t.stopLvl.toFixed(2)}</dd><dt>Volume</dt><dd>${t.vol.toFixed(2)}× avg</dd>${t.half ? "<dt>Half sold</dt><dd>at +1.5 ATR</dd>" : ""}${t.addQty ? `<dt>Added</dt><dd>×${t.addQty} @ $${t.addPx.toFixed(2)}</dd>` : ""}<dt>Balance after</dt><dd>${money(t.eq)}</dd>${t.alpaca ? `<dt>Alpaca fills</dt><dd>${t.alpaca.buy != null ? "$" + t.alpaca.buy.toFixed(2) : "…"} → ${t.alpaca.sell != null ? "$" + t.alpaca.sell.toFixed(2) : (t.open ? "open" : "…")}</dd>${t.alpaca.pnl != null ? `<dt>Alpaca P&amp;L</dt><dd class="${cls(t.alpaca.pnl)}">${sgnUsd(t.alpaca.pnl)}</dd>` : ""}` : ""}</dl>
    <div class="checks">${D.paper ? `<span class="chk" style="${t.fills === "real" ? "" : "background:var(--grid);color:var(--muted)"}">${t.fills === "real" ? "real option prices" : "modeled prices"}</span>` : ""}${t.kind ? `<span class="chk">${({ runner: "runner · Sniper+ setup", ride: "ride · Sniper+ setup", scalp: "scalp · Sniper setup", pullback1m: "1m pullback · 5m/15m/1h/50-day ✓" })[t.kind]}</span>` : ""}${["sniper_ppp", "sniper4", "sniped1", "combined"].includes(state.rule) ? "" : state.rule === "daily" ? `<span class="chk">quality ${t.score}/10</span>` : '<span class="chk">5m ✓</span><span class="chk">15m ✓</span><span class="chk">1h ✓</span><span class="chk">vol ✓</span>' + (state.rule !== "sniper" ? '<span class="chk">50-day ✓</span>' : "") + (state.rule.endsWith("scalp") ? '<span class="chk">scalp</span>' : "")}</div>`;
  renderHud(null);
  renderEquity();
}

function placeBand() {   // shaded holding period, drawn as an overlay that follows the time axis
  const el = $("band");
  if (!band) { el.hidden = true; return; }
  const ts = px.timeScale();
  const a = ts.timeToCoordinate(band.from), b = ts.timeToCoordinate(band.to);
  if (a == null || b == null) { el.hidden = true; return; }
  const half = Math.max(2, ts.options().barSpacing / 2);
  el.hidden = false;
  el.style.left = `${a - half}px`;
  el.style.width = `${b - a + 2 * half}px`;
  el.style.background = band.color;
}

function renderHud(p) {
  const t = trades()[state.k]; if (!t) return;
  const r = chartOf(t.day, t);
  let i = r.t.length - 1;
  if (p && p.time) { const k = r.t.indexOf(p.time); if (k >= 0) i = k; }
  $("hud").innerHTML = `<span>SPY ${ttf(t)}m${t.bot ? " · " + t.bot : ""}</span><span>${hhmm(r.t[i])}</span><span>O <b>${r.o[i].toFixed(2)}</b></span><span>H <b>${r.h[i].toFixed(2)}</b></span><span>L <b>${r.l[i].toFixed(2)}</b></span><span>C <b>${r.c[i].toFixed(2)}</b></span>` +
    (r.vwap[i] != null ? `<span>VWAP <b>${r.vwap[i].toFixed(2)}</b></span>` : "");
}

function renderTable() {
  const all = run().trades;
  const ts = trades();
  $("tradeCount").textContent = `${ts.length} trades · ${D.names[state.rule]} · ${money(state.cap, 0)} · ${SZ[state.size]}`;
  $("tbody").innerHTML = "";
  ts.forEach((t, k) => {
    const tr = document.createElement("tr");
    tr.tabIndex = 0;
    if (k === state.k) tr.classList.add("hl");
    tr.innerHTML = `<td>${dayShort(t.day)}</td><td><span class="side ${t.side}">${t.side === "C" ? "CALL" : "PUT"}</span>SPY ${t.strike}${t.side}${t.bot ? ` <span class="tag">${t.bot}</span>` : ""}</td><td>${hhmm(t.tIn)}</td><td>${hhmm(t.tOut)}</td><td>${Math.round((t.tOut - t.tIn) / 60)}m</td><td>${t.qty}</td><td>${t.optIn.toFixed(2)}</td><td>${t.optOut.toFixed(2)}</td><td class="${cls(t.pnl)}">${sgnUsd(t.pnl)}</td><td class="${cls(t.pnl)}">${sgn(t.pct, 0)}%</td><td class="why">${WHY[t.reason] || t.reason}</td><td>${money(t.eq)}</td>`;
    const go = () => { state.k = k; renderTrade(); renderTable(); $("px").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" }); };
    tr.onclick = go; tr.onkeydown = (e) => { if (e.key === "Enter") go(); };
    $("tbody").append(tr);
  });
}

function renderCmp() {
  if (D.paper) {
    document.querySelector("#cmp").closest("section").querySelector("h2").textContent = "All bots this week";
    $("hUnseen").textContent = D.tableHead[0]; $("hDesign").textContent = D.tableHead[1];
    $("cmp").innerHTML = D.table.map((c) => `<tr class="${c.key === state.rule ? "pick" : ""}"><td>${c.name}</td><td>${c.a[0]} trades</td><td>${c.a[2]}%</td><td class="${cls(c.a[1])}">${sgnUsd(c.a[1])}</td><td>${c.b[0]} trades</td><td>${c.b[2]}%</td><td class="${cls(c.b[1])}">${sgnUsd(c.b[1])}</td><td class="${cls(c.worst)}">${sgnUsd(c.worst)}</td></tr>`).join("");
    return;
  }
  const prev = D.days[D.days.indexOf(D.designStart) - 1];
  $("hUnseen").textContent = `${dayShort(D.days[0])} – ${dayShort(prev)} · untouched`;
  $("hDesign").textContent = `${dayShort(D.designStart)} – ${dayShort(D.days.at(-1))} · designed on`;
  $("cmp").innerHTML = D.table.map((c) => `<tr class="${c.key === state.rule ? "pick" : ""}"><td>${c.name}</td>${["sniped1", "combined"].includes(c.key) ? '<td class="mut">no 1m data</td><td></td><td></td>' : `<td>${c.unseen[0]} trades</td><td>${c.unseen[2]}%</td><td class="${cls(c.unseen[1])}">${sgnUsd(c.unseen[1])}</td>`}<td>${c.design[0]} trades</td><td>${c.design[2]}%</td><td class="${cls(c.design[1])}">${sgnUsd(c.design[1])}</td><td class="neg">${sgnUsd(c.worst)}</td></tr>`).join("");
}


function renderBoard() {
  if (!D.paper) return;
  $("board").hidden = false;
  $("segStrat").hidden = true;
  document.querySelector("#cmp").closest("section").hidden = true;
  const ph = state.period, z = state.size;
  const live = $("live");
  live.className = "live" + (D.marketOpen ? " on" : "");
  live.querySelector("span").textContent = D.marketOpen ? `LIVE · updated ${D.updated} ET` : (D.updated ? `Market closed · last update ${D.updated} ET` : `Live paper starts ${D.liveStart} 9:30 ET`);
  $("boardTitle").textContent = ph === "live" ? "Leaderboard · live paper" : "Leaderboard · replay";
  $("todayHead").textContent = ph === "live" ? "Today" : "Last day";
  const rows = Object.keys(D.names).map((k) => ({ k, s100: D.runs[`${k}|${ph}|100|${z}`].stats, s500: D.runs[`${k}|${ph}|500|${z}`].stats }));
  const any = rows.some((r) => r.s100.trades);
  rows.sort((a, b) => b.s100.ret - a.s100.ret || b.s500.ret - a.s500.ret || b.s100.trades - a.s100.trades);
  const medal = (i) => `<span class="medal ${i < 3 ? "m" + (i + 1) : "mN"}">${i + 1}</span>`;
  const usd = (v) => money(v, 2);
  $("podium").innerHTML = any ? rows.slice(0, 3).map((r, i) => `
    <button class="pcard ${r.k === state.rule ? "sel" : ""}" data-k="${r.k}" type="button">
      <div class="top">${medal(i)}<span class="nm">${D.names[r.k]}</span><span class="ret ${cls(r.s100.ret)}">${sgn(r.s100.ret, 1)}%</span></div>
      <div class="bal"><div><span>$100 account</span><b>${usd(r.s100.final)}</b></div><div><span>$500 account</span><b>${usd(r.s500.final)}</b></div></div>
      <div class="meta"><span>Win <b>${r.s100.winRate.toFixed(0)}%</b></span><span>Trades <b>${r.s100.trades}</b></span><span>Best <b>${sgn(r.s100.best, 0)}%</b></span>${r.s100.open ? '<span class="opentag">Open</span>' : ""}</div>
    </button>`).join("") : `<div class="empty">No trades yet. Bots start at the 9:30 ET open and the board updates every 5 minutes.</div>`;
  $("ranks").innerHTML = rows.map((r, i) => `<tr tabindex="0" data-k="${r.k}" class="${r.k === state.rule ? "sel" : ""}">
    <td class="rk">${medal(i)}</td><td class="bot">${D.names[r.k]}${r.s100.open ? '<span class="opentag">Open</span>' : ""}</td>
    <td>${usd(r.s100.final)}</td><td>${usd(r.s500.final)}</td><td class="${cls(r.s100.ret)}">${sgn(r.s100.ret, 1)}%</td>
    <td>${r.s100.trades ? r.s100.winRate.toFixed(0) + "%" : "—"}</td><td>${r.s100.trades}</td>
    <td class="${cls(r.s100.bestUsd)}">${r.s100.trades ? sgnUsd(r.s100.bestUsd) : "—"}</td><td class="${cls(r.s100.worstUsd)}">${r.s100.trades ? sgnUsd(r.s100.worstUsd) : "—"}</td>
    <td>${r.s100.trades ? "−" + r.s100.mdd.toFixed(0) + "%" : "—"}</td><td class="${cls(r.s100.todayPnl)}">${r.s100.trades ? sgnUsd(r.s100.todayPnl) : "—"}</td>
    <td>${r.s100.alpacaPnl == null ? `<span class="mut">${state.period === "live" ? "50% only" : "—"}</span>` : `<span class="${cls(r.s100.alpacaPnl)}">${sgnUsd(r.s100.alpacaPnl)}</span> <span class="mut">·</span> <span class="${cls(r.s500.alpacaPnl)}">${sgnUsd(r.s500.alpacaPnl)}</span>`}</td></tr>`).join("");
  for (const el of document.querySelectorAll("#podium .pcard, #ranks tr")) {
    const go = () => { state.rule = el.dataset.k; state.k = 0; fixPeriod(); update(); };
    el.onclick = go;
    el.onkeydown = (e) => { if (e.key === "Enter") go(); };
  }
}

function update() { save(); setRange(); renderBoard(); renderControls(); renderKpis(); renderTrade(); renderTable(); renderCmp(); }

$("prevT").onclick = () => { if (state.k > 0) { state.k--; renderTrade(); renderTable(); } };
$("nextT").onclick = () => { if (state.k < trades().length - 1) { state.k++; renderTrade(); renderTable(); } };
