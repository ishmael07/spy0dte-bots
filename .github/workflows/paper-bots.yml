name: paper-bots
# Live paper trading for the SPY 0DTE bots on Alpaca data. Two jobs per weekday (GitHub caps a job at 6h):
# the morning job starts before the open and runs ~5h40m; the afternoon job picks up and runs to the close.
on:
  schedule:
    # GitHub sometimes delays or drops scheduled runs, so there are several start triggers. Runs share one
    # concurrency group: one job runs, at most one more waits; a job that finds the market closed exits at once,
    # and a late job backfills the minutes it missed from Alpaca's history.
    - cron: "35 12 * * 1-5"
    - cron: "50 12 * * 1-5"
    - cron: "5 13 * * 1-5"
    - cron: "20 13 * * 1-5"
    - cron: "40 18 * * 1-5"
    - cron: "10 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-bots
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy pandas requests
      - name: Run bots
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # optional dedicated paper accounts (alpaca/accounts.json); skipped if the secrets aren't set
          ALPACA2_KEY_ID: ${{ secrets.ALPACA2_KEY_ID }}
          ALPACA2_SECRET_KEY: ${{ secrets.ALPACA2_SECRET_KEY }}
          ALPACA3_KEY_ID: ${{ secrets.ALPACA3_KEY_ID }}
          ALPACA3_SECRET_KEY: ${{ secrets.ALPACA3_SECRET_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python alpaca/run.py --max-minutes 340 --publish-every 6 --orders
